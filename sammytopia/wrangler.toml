name = "sammytopia"

compatibility_date = "2026-06-01"

[assets]
directory = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "sammytopia-db"
database_id = "b7a9e254-299d-4d90-9025-6fe6515775f9"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sammytopia-media"

# ADMIN_PASSWORD is set as a secret in the Cloudflare dashboard.
# Never put the real admin password in this file.
