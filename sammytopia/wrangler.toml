name = "sammytopia"
main = "worker.ts"
compatibility_date = "2026-06-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "sammytopia-db"
database_id = "b7a9e254-299d-4d90-9025-6fe6515775f9"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sammytopia-media"

# ADMIN_PASSWORD is set as a secret, not here:
#   Cloudflare dashboard -> sammytopia4 -> Settings -> Variables and Secrets
# Never commit the real admin password to GitHub.
